    <!DOCTYPE html>
    <html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://unpkg.com/tailwindcss@1.9.6/dist/tailwind.min.css" rel="stylesheet">
        <title>Arena | MYTHORIA</title>
        <script type="module" src="./js/main.js"></script>
    </head>
    <body>
        <header class="flex items-center flex-wrap justify-between p-6 text-white bg-black">


            <h1 class="text-2xl lg:text-3xl">MYTHORIA</h1>
            <p class="text-sm font-semibold">Arène de combat</p>

        </header>

        <main id="main" class="flex flex-col lg:flex-row">
            <div class="w-full lg:w-3/4 min-w-0">
                <section>
                    <div class="p-6 bg-gray-300 font-semibold">
                        <h2>Adversaire — Ténèbres</h2>
                        <p>HP : 3000</p>
                        <div class="mt-4 grid grid-cols-5 lg:grid-cols-10 gap-2">
                        <div class="h-32 border border-gray-500"></div>
                        <div class="h-32 border border-gray-500"></div>
                        <div class="h-32 border border-gray-500"></div>
                        <div class="h-32 border border-gray-500"></div>
                        <div class="h-32 border border-gray-500"></div>
                        <div class="h-32 border border-gray-500"></div>
                        <div class="h-32 border border-gray-500"></div>
                        <div class="h-32 border border-gray-500"></div>
                        <div class="h-32 border border-gray-500"></div>
                        <div class="h-32 border border-gray-500"></div>
                </div>
                        <p class="mt-3 text-sm">Terrain adverse · 10 places</p>
                    </div>
                </section>
                <div class="text-center text-white bg-black p-4">
                Tour 1 — Votre tour
                </div>
                <section class="p-4 lg:p-6 bg-gray-300">
                    <div class="p-6 bg-gray-300 font-semibold">
                        <h2>Vous — Lumière</h2>
                        <p>HP : 3000</p>
                        <div class="mt-4 grid grid-cols-5 lg:grid-cols-10 gap-2">
                            <div class="h-32 border border-gray-500"></div>
                            <div class="h-32 border border-gray-500"></div>
                            <div class="h-32 border border-gray-500"></div>
                            <div class="h-32 border border-gray-500"></div>
                            <div class="h-32 border border-gray-500"></div>
                            <div class="h-32 border border-gray-500"></div>
                            <div class="h-32 border border-gray-500"></div>
                            <div class="h-32 border border-gray-500"></div>
                            <div class="h-32 border border-gray-500"></div>
                            <div class="h-32 border border-gray-500"></div>
                        </div>
                        <p class="mt-3 text-sm">Votre terrain · 10 places</p>
                    </div>
                </section>
                <section class="bg-black p-4 lg:p-6 text-white">
                        <h2 class="font-semibold">
                            Votre main 5/5
                        </h2>
                        <div id="player-hand" class="grid grid-cols-5 gap-2 p-4">
                        </div>
                </section>
            </div>
            
            
                <aside class="w-full lg:w-1/4 p-6 bg-gray-200">
                    <h2 class="text-center font-semibold p-6">Deck</h2>
                    <div class="mx-auto w-36 "><img src="./assets/images/face-down.png"></div>
                    <p
                    class="text-center mt-4 " id="len">15 cartes restantes</p>
                    <button class="flex items-center p-6 bg-yellow-600 text-white font-semibold py-3 mt-4 border-gray-500"  type="button" ">Fin du tour</button>
                </aside>
        </main>
    </body>
    </html>
