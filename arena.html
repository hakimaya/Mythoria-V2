    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://unpkg.com/tailwindcss@1.9.6/dist/tailwind.min.css" rel="stylesheet">
        <title>Arena | MYTHORIA</title>
    </head>
    <body>
        <header class="flex items-center flex-row justify-between p-6 text-white bg-black">


            <h1 class="text-3xl">MYTHORIA</h1>
            <p class="font-semibold">Arena de combat</p>

        </header>

        <main class="flex">
            <div class="w-3/4">
                    <section>
                    <div class="p-6 bg-gray-300 font-semibold">
                        <h2>Adversaire — Ténèbres</h2>
                        <p>HP : 3000</p>
                        <div class="mt-4 grid grid-cols-10 gap-2 p-4">
                            <div class="h-32 border border-gray-500"></div>
                            <div class="h-32 border border-gray-500"></div>
                            <div class="h-32 border border-gray-500"></div>
                            <div class="h-32 border border-gray-500"></div>
                            <div class="h-32 border border-gray-500"></div>
                            <div class="h-32 border border-gray-500"></div>
                            <div class="h-32 border border-gray-500"></div>
                            <div class="h-32 border border-gray-500"></div>
                            <div class="h-32 border border-gray-500"></div>
                            <div class="h-32 border border-gray-500"></div>
                        </div>
                        <p>Terrain adverse . 10place</p>
                    </div>
                </section>
                <section class="flex justify-center text-white bg-black p-4">
                    <div>Tour 1 - Votre tour</div>
                </section>
                <section>
                    <div class="p-6 bg-gray-300 font-semibold">
                        <h2>Vous — Lumière</h2>
                        <p>HP : 3000</p>
                        <div class="mt-4 grid grid-cols-10 gap-2 p-4">
                            <div class="h-32 border border-gray-500"></div>
                            <div class="h-32 border border-gray-500"></div>
                            <div class="h-32 border border-gray-500"></div>
                            <div class="h-32 border border-gray-500"></div>
                            <div class="h-32 border border-gray-500"></div>
                            <div class="h-32 border border-gray-500"></div>
                            <div class="h-32 border border-gray-500"></div>
                            <div class="h-32 border border-gray-500"></div>
                            <div class="h-32 border border-gray-500"></div>
                            <div class="h-32 border border-gray-500"></div>
                        </div>
                        <p>Votre Terrain . 10place</p>
                    </div>
                </section>
                <section>
                    <div class="bg-black font-semibold p-6 text-white ">
                        <p>
                            Votre main 5/5
                        </p>
                        <div class="grid grid-cols-5 gap-2 p-4">
                            <div class="h-40 border border-gray-500 text-center">Carte 1</div>
                            <div class="h-40 border border-gray-500 text-center">carte 2</div>
                            <div class="h-40 border border-gray-500 text-center">carte 3</div>
                            <div class="h-40 border border-gray-500 text-center">carte 4</div>
                            <div class="h-40 border border-gray-500 text-center">carte 5</div>
                        </div>
                    </div>
                </section>
            </div>
            
            <section>
                <aside class="p-6">
                    <p class="text-center font-semibold p-6">Deck</p>
                    <div class="mx-auto h-40 w-40 border border-gray-500 "></div>
                    <p
                    class="text-center mt-4">15 cartes restantes</p>
                    <button class="w-full bg-yellow-600 text-white font-semibold py-3 mt-4 border-gray-500"  type="button">Fin du tour</button>
                </aside>
            </section>
        </main>
    </body>
    </html>
