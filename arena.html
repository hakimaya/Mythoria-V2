<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arène | Mythoria</title>
    <link rel="stylesheet" href="https://unpkg.com/tailwindcss@1.9.6/dist/tailwind.min.css">
    <script type="module" src="./js/main.js"></script>
</head>

<body class="min-h-screen bg-gray-900 text-gray-100">
    <header class="border-b border-purple-800 bg-black">
        <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between px-4 py-5 sm:px-6">
            <h1 class="font-serif text-2xl font-bold tracking-widest text-yellow-300">
                MYTHORIA
            </h1>
            <p class="text-sm text-gray-300">Arène de combat</p>
        </div>
    </header>

    <section id="camp-choice" class="hidden border-b border-purple-800 bg-purple-900 px-4 py-6 text-center">
        <h2 class="font-serif text-2xl text-yellow-200">Choisissez votre camp</h2>
        <p class="mt-2 text-sm text-purple-100">Vous commencez la partie.</p>

        <div class="mx-auto mt-4 grid max-w-sm grid-cols-2 gap-3">
            <button id="choose-light" type="button"
                class="rounded-lg bg-yellow-300 px-3 py-3 font-semibold text-gray-900 hover:bg-yellow-200">
                Lumière
            </button>
            <button id="choose-dark" type="button"
                class="rounded-lg border border-purple-400 bg-gray-900 px-3 py-3 font-semibold hover:bg-purple-800">
                Ténèbres
            </button>
        </div>
    </section>

    <main id="main" class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:flex lg:items-start">
        <div class="min-w-0 space-y-4 lg:mr-5 lg:flex-1">

            <section class="rounded-xl border border-purple-800 bg-purple-900 p-3 sm:p-5">
                <div class="flex flex-wrap items-center justify-between">
                    <h2 id="Adversaire" class="font-serif text-lg font-semibold text-purple-100">
                        Adversaire
                    </h2>
                    <p id="opponent-hp" class="rounded-full bg-gray-900 px-3 py-1 text-sm text-purple-100">
                        HP : 3000
                    </p>
                </div>

                <div id="opponent-battlefield" class="mt-4 grid grid-cols-5 gap-2 lg:grid-cols-10">
                    <div class="h-20 overflow-hidden rounded border border-purple-600 bg-gray-900 sm:h-24"></div>
                    <div class="h-20 overflow-hidden rounded border border-purple-600 bg-gray-900 sm:h-24"></div>
                    <div class="h-20 overflow-hidden rounded border border-purple-600 bg-gray-900 sm:h-24"></div>
                    <div class="h-20 overflow-hidden rounded border border-purple-600 bg-gray-900 sm:h-24"></div>
                    <div class="h-20 overflow-hidden rounded border border-purple-600 bg-gray-900 sm:h-24"></div>
                    <div class="h-20 overflow-hidden rounded border border-purple-600 bg-gray-900 sm:h-24"></div>
                    <div class="h-20 overflow-hidden rounded border border-purple-600 bg-gray-900 sm:h-24"></div>
                    <div class="h-20 overflow-hidden rounded border border-purple-600 bg-gray-900 sm:h-24"></div>
                    <div class="h-20 overflow-hidden rounded border border-purple-600 bg-gray-900 sm:h-24"></div>
                    <div class="h-20 overflow-hidden rounded border border-purple-600 bg-gray-900 sm:h-24"></div>
                </div>
            </section>

            <p id="turn-status" role="status"
                class="rounded-lg border border-gray-700 bg-black px-3 py-2 text-center text-sm font-semibold text-yellow-200">
                Tour 1
            </p>

            <section class="rounded-xl border border-yellow-700 bg-gray-800 p-3 sm:p-5">
                <div class="flex flex-wrap items-center justify-between">
                    <h2 id="player" class="font-serif text-lg font-semibold text-yellow-200">
                        Vous
                    </h2>
                    <p id="player-hp" class="rounded-full bg-gray-900 px-3 py-1 text-sm text-yellow-200">
                        HP : 3000
                    </p>
                </div>

                <div id="player-battlefield" class="mt-4 grid grid-cols-5 gap-2 lg:grid-cols-10">
                    <div class="h-20 overflow-hidden rounded border border-yellow-700 bg-gray-900 sm:h-24"></div>
                    <div class="h-20 overflow-hidden rounded border border-yellow-700 bg-gray-900 sm:h-24"></div>
                    <div class="h-20 overflow-hidden rounded border border-yellow-700 bg-gray-900 sm:h-24"></div>
                    <div class="h-20 overflow-hidden rounded border border-yellow-700 bg-gray-900 sm:h-24"></div>
                    <div class="h-20 overflow-hidden rounded border border-yellow-700 bg-gray-900 sm:h-24"></div>
                    <div class="h-20 overflow-hidden rounded border border-yellow-700 bg-gray-900 sm:h-24"></div>
                    <div class="h-20 overflow-hidden rounded border border-yellow-700 bg-gray-900 sm:h-24"></div>
                    <div class="h-20 overflow-hidden rounded border border-yellow-700 bg-gray-900 sm:h-24"></div>
                    <div class="h-20 overflow-hidden rounded border border-yellow-700 bg-gray-900 sm:h-24"></div>
                    <div class="h-20 overflow-hidden rounded border border-yellow-700 bg-gray-900 sm:h-24"></div>
                </div>
            </section>

            <section class="rounded-xl border border-gray-700 bg-black p-3 sm:p-5">
                <h2 class="font-serif text-lg font-semibold text-yellow-200">Votre main</h2>
                <div id="player-hand" class="mt-3 grid grid-cols-2 gap-3 text-sm sm:grid-cols-5"></div>
            </section>
        </div>

        <aside class="mt-4 rounded-xl border border-purple-800 bg-gray-800 p-4 lg:mt-0 lg:w-48 lg:flex-shrink-0">
            <div class="flex items-center justify-center lg:block lg:text-center">
                <img src="./assets/images/face-down.png" alt=""
                    class="mr-4 w-12 rounded lg:mx-auto lg:mb-3 lg:w-24">
                <div>
                    <h2 class="font-serif text-lg font-semibold text-yellow-200">Deck</h2>
                    <p id="len" class="mt-1 text-sm text-gray-300">Chargement…</p>
                </div>
            </div>

            <button id="fintour" type="button"
                class="mt-4 w-full rounded-lg bg-yellow-300 px-4 py-3 font-bold text-gray-900 hover:bg-yellow-200">
                Fin du tour
            </button>
        </aside>
    </main>
</body>
</html>
